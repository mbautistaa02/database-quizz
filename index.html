<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Bases de Datos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #FFFFFF;
            color: #1f2937;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .header {
            background: #D853B4;
            color: #FFFFFF;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-top: 0;
        }

        .progress {
            background: #FFFFFF;
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-bar {
            background: #B0238A;
            height: 100%;
            width: 0%;
            transition: 0.3s;
        }

        .card {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(176, 35, 138, 0.12);
            margin-bottom: 20px;
        }

        .question-number {
            color: #B0238A;
            font-weight: bold;
        }

        .question {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #BCEDEF;
            border-radius: 10px;
            background: #FFFFFF;
            color: #1f2937;
            cursor: pointer;
            font-size: 16px;
        }

        .option:hover:not(:disabled) {
            border-color: #D853B4;
            background: #fdf2fa;
        }

        .option:disabled {
            cursor: default;
            color: #1f2937;
        }

        .correct {
            background: #dcfce7 !important;
            border-color: #22a06b !important;
        }

        .incorrect {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
        }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            background: #BCEDEF;
            border-radius: 10px;
            display: none;
            line-height: 1.5;
        }

        .next, .restart, .level-button, .secondary {
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: #B0238A;
            color: #FFFFFF;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        .next {
            margin-top: 20px;
            display: none;
        }

        .next:hover, .restart:hover, .level-button:hover {
            background: #8F1C70;
        }

        .secondary {
            background: #BCEDEF;
            color: #1f2937;
        }

        .secondary:hover {
            background: #91dfe4;
        }

        .result, #quiz, #levelMenu {
            display: none;
        }

        .score {
            font-size: 50px;
            color: #B0238A;
            font-weight: bold;
        }

        .level-description {
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .code-example {
            display: block;
            padding: 12px;
            margin-top: 10px;
            background: #f3f4f6;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .menu-actions, .result-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 15px auto;
                padding: 12px;
            }

            .header, .card {
                padding: 22px;
            }

            .question {
                font-size: 19px;
            }

            .score {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🗄️ Quiz de Bases de Datos</h1>
        <p id="subtitle">Aprende mientras respondes</p>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- Menú de niveles -->
    <div class="card" id="levelMenu">
        <h2>¡Elige tu nivel!</h2>

        <div class="level-description">
            <p><strong>Nivel 1: Fundamentos</strong></p>
            <p>Conceptos básicos, tablas, claves y consultas SQL.</p>

            <p><strong>Nivel 2: SQL avanzado</strong></p>
            <p>JOIN, subconsultas, funciones de agregación, vistas, permisos y roles.</p>
        </div>

        <div class="menu-actions">
            <button class="level-button" onclick="startLevel(1)">
                Comenzar nivel 1
            </button>

            <button class="level-button" onclick="startLevel(2)">
                Ir al nivel 2 →
            </button>
        </div>
    </div>

    <!-- Pantalla de preguntas -->
    <div class="card" id="quiz">
        <div class="question-number" id="questionNumber"></div>
        <div class="question" id="question"></div>
        <div id="options"></div>

        <div class="explanation" id="explanation"></div>

        <button class="next" id="nextButton" onclick="nextQuestion()">
            Siguiente →
        </button>
    </div>

    <!-- Resultados -->
    <div class="card result" id="result">
        <h2>🎉 ¡Nivel terminado!</h2>
        <p id="resultTitle"></p>
        <p>Tu puntuación fue:</p>

        <div class="score" id="score"></div>
        <p id="message"></p>

        <div class="result-actions">
            <button class="restart" onclick="restartLevel()">
                Repetir nivel
            </button>

            <button class="level-button" id="nextLevelButton"
                    onclick="startLevel(2)">
                Desbloquear nivel 2 →
            </button>

            <button class="secondary" onclick="showMenu()">
                Menú de niveles
            </button>
        </div>
    </div>

</div>

<script>

// ===============================
// NIVEL 1: FUNDAMENTOS
// ===============================

const level1 = [
    {
        question: "¿Qué es una base de datos?",

            "Un programa para diseñar páginas web",
            "Una colección organizada de datos",
            "Un lenguaje de programación",
            "Un sistema operativo"
        ],
        answer: 1,
        explanation: "Una base de datos es una colección organizada de información que permite almacenar, consultar y administrar datos."
    },
    {
        question: "¿Qué significa SQL?",
        options: [
            "Simple Query Language",
            "Structured Query Language",
            "System Question Language",
            "Structured Quick Logic"
        ],
        answer: 1,
        explanation: "SQL significa Structured Query Language y se utiliza para trabajar con bases de datos relacionales."
    },
    {
        question: "¿Cuál es un sistema gestor de bases de datos?",
        options: ["MySQL", "HTML", "Git", "React"],
        answer: 0,
        explanation: "MySQL es un SGBD. Otros ejemplos son PostgreSQL, Oracle Database y SQL Server."
    },
    {
        question: "¿Qué es una tabla relacional?",
        options: [
            "Un conjunto de filas y columnas",
            "Un archivo de imágenes",
            "Un programa",
            "Una contraseña"
        ],
        answer: 0,
        explanation: "Una tabla organiza los datos en filas (registros) y columnas (atributos)."
    },
    {
        question: "¿Qué representa una fila?",
        options: [
            "Una base de datos completa",

            "Una consulta"
        ],
        answer: 1,
        explanation: "Cada fila representa un registro almacenado en la tabla."
    },
    {
        question: "¿Qué representa una columna?",
        options: [
            "Un atributo",
            "Una tabla completa",
            "Una relación",
            "Un usuario"
        ],
        answer: 0,
        explanation: "Una columna representa un atributo, como el nombre de un estudiante."
    },
    {
        question: "¿Para qué sirve PRIMARY KEY?",
        options: [
            "Para ordenar alfabéticamente",
            "Para identificar de manera única cada registro",
            "Para eliminar registros",
            "Para crear copias"
        ],
        answer: 1,
        explanation: "La clave primaria identifica de forma única cada fila y no admite valores NULL."
    },
    {
        question: "¿Qué característica tiene una PRIMARY KEY?",
        options: [
            "Puede repetirse",
            "Identifica de forma única cada registro",
            "Siempre debe ser texto",
            "Siempre debe ser mayor que 100"
        ],
        answer: 1,
        explanation: "Una clave primaria debe ser única y no puede contener valores NULL."
    },
    {
        question: "¿Para qué sirve FOREIGN KEY?",
        options: [
            "Para relacionar tablas",
            "Para cifrar datos",
            "Para borrar una base de datos",
            "Para crear usuarios"
        ],
        answer: 0,
        explanation: "Una clave foránea referencia una clave de otra tabla o de la misma tabla."
    },
    {
        question: "¿Qué hace SELECT?",
        options: [
            "Elimina datos",
            "Modifica datos",
            "Consulta datos",
            "Crea usuarios"
        ],
        answer: 2,
        explanation: "SELECT permite consultar y obtener información de una base de datos."
    },
    {
        question: "¿Qué hace INSERT?",
        options: [
            "Agrega registros",
            "Elimina registros",
            "Modifica tablas",
            "Cierra la conexión"
        ],
        answer: 0,
        explanation: "INSERT agrega nuevos registros a una tabla."
    },
    {
        question: "¿Qué hace UPDATE?",
        options: [
            "Consulta datos",
            "Modifica registros existentes",
            "Crea una base de datos",
            "Elimina una tabla"
        ],
        answer: 1,
        explanation: "UPDATE permite modificar datos existentes."
    },
    {
        question: "¿Qué hace DELETE?",
        options: [
            "Elimina registros",
            "Crea registros",
            "Consulta registros",
            "Cambia nombres"
        ],
        answer: 0,
        explanation: "DELETE elimina registros. WHERE permite limitar cuáles se eliminan."
    },
    {
        question: "¿Qué hace WHERE?",
        options: [
            "Ordena resultados",
            "Filtra registros",
            "Crea una tabla",
            "Cuenta columnas"
        ],
        answer: 1,
        explanation: "WHERE establece condiciones para seleccionar registros."
    },
    {
        question: "¿Qué hace ORDER BY?",
        options: [
            "Ordena los resultados",

        ],
        answer: 0,
        explanation: "ORDER BY ordena los resultados de una consulta."
    },
    {
        question: "¿Qué significa NULL?",
        options: [
            "El número cero",
            "Una cadena vacía",
            "Ausencia o desconocimiento de un valor",
            "Un valor negativo"
        ],
        answer: 2,
        explanation: "NULL representa la ausencia de un valor; no equivale necesariamente a cero o a una cadena vacía."
    },
    {
        question: "¿Qué es la normalización?",
        options: [
            "Un proceso para reducir redundancia y mejorar la estructura de los datos",
            "Un método para aumentar el tamaño",
            "Un lenguaje",
            "Una forma de cifrado"
        ],
        answer: 0,
        explanation: "La normalización organiza las tablas para reducir redundancias y anomalías."
    },
    {
        question: "¿Qué representa una FOREIGN KEY?",
        options: [
            "Una relación entre datos de tablas",
            "Una conexión entre computadoras",
            "Una relación entre lenguajes",
            "Una contraseña"
        ],
        answer: 0,
        explanation: "Una clave foránea permite establecer relaciones entre registros."
    },
    {
        question: "¿Qué caracteriza a una base de datos relacional?",
        options: [
            "Organiza información en tablas relacionadas",
            "Solo almacena imágenes",
            "No permite consultas",
            "No permite restricciones"
        ],
        answer: 0,
        explanation: "Las bases de datos relacionales organizan los datos en tablas que pueden relacionarse."
    },
    {
        question: "¿Qué es una consulta (query)?",
        options: [
            "Una instrucción para obtener o manipular información",
            "Un tipo de servidor",
            "Una contraseña",
            "Una copia de seguridad"
        ],
        answer: 0,
        explanation: "Una consulta es una instrucción que permite consultar o manipular información."
    }
];


// ===============================
// NIVEL 2: SQL AVANZADO
// ===============================

const level2 = [
    {
        question: "¿Para qué sirve INNER JOIN?",
        options: [
            "Para mostrar todas las filas de ambas tablas",
            "Para combinar filas que cumplen la condición de unión",
            "Para eliminar filas repetidas",
            "Para crear una vista"
        ],
        answer: 1,
        explanation: "INNER JOIN devuelve las filas que tienen coincidencias en ambas tablas según la condición ON."
    },
    {
        question: "¿Qué diferencia a LEFT JOIN de INNER JOIN?",
        options: [
            "LEFT JOIN conserva todas las filas de la tabla izquierda, aunque no tengan coincidencia",
            "LEFT JOIN solo devuelve coincidencias",
            "LEFT JOIN elimina la tabla izquierda",
            "No existe ninguna diferencia"
        ],
        answer: 0,
        explanation: "LEFT JOIN conserva todas las filas de la tabla izquierda. Cuando no hay coincidencia, las columnas de la derecha aparecen como NULL."
    },
    {
        question: "¿Qué devuelve RIGHT JOIN?",
        options: [
            "Solo filas de la tabla izquierda",
            "Todas las filas de la tabla derecha y sus coincidencias en la izquierda",
            "Solo las filas coincidentes",
            "Un conteo de las tablas"
        ],
        answer: 1,
        explanation: "RIGHT JOIN conserva todas las filas de la tabla derecha, incluso cuando no tienen coincidencia en la izquierda."
    },
    {
        question: "¿Qué busca obtener FULL OUTER JOIN?",
        options: [
            "Solo las filas coincidentes",
            "Todas las filas de ambas tablas, coincidan o no",
            "Solo las filas de la izquierda",
            "Solo las filas de la derecha"
        ],
        answer: 1,
        explanation: "FULL OUTER JOIN conserva las filas de ambas tablas. Las columnas sin coincidencia se completan con NULL. No todos los SGBD lo admiten directamente."
    },
    {
        question: "Observa la consulta. ¿Qué información devuelve?",
        code: "SELECT E.nombre, C.nombre\nFROM Estudiantes E\nINNER JOIN Cursos C ON E.curso_id = C.id;",
        options: [
            "Todos los estudiantes, tengan curso o no",
            "Los nombres de estudiantes y sus cursos coincidentes",
            "Solo los cursos sin estudiantes",
            "El número de cursos"
        ],
        answer: 1,
        explanation: "La condición ON relaciona cada estudiante con el curso cuyo id coincide con curso_id. INNER JOIN excluye las filas sin coincidencia."
    },
    {
        question: "¿Qué es una subconsulta?",
        options: [
            "Una consulta SQL dentro de otra consulta",
            "Una tabla sin columnas",
            "Un usuario de la base de datos",
            "Una función para ordenar"
        ],
        answer: 0,
        explanation: "Una subconsulta es una consulta anidada que proporciona datos a otra consulta."
    },
    {
        question: "¿Qué devuelve esta consulta si hay productos con precio superior al promedio?",
        code: "SELECT nombre\nFROM Productos\nWHERE precio > (\n  SELECT AVG(precio) FROM Productos\n);",
        options: [
            "Todos los productos",
            "Los productos cuyo precio supera el promedio",
            "El producto más barato",
            "El promedio de los nombres"
        ],
        answer: 1,
        explanation: "La subconsulta calcula el precio promedio y la consulta externa selecciona los productos que lo superan."
    },
    {
        question: "¿Qué función calcula el promedio de una columna numérica?",
        options: ["COUNT()", "SUM()", "AVG()", "MAX()"],
        answer: 2,
        explanation: "AVG() calcula el promedio de los valores no NULL de una columna."
    },
    {
        question: "¿Qué devuelve MIN(precio)?",
        options: [
            "El precio más alto",
            "La suma de los precios",
            "El precio más bajo",
            "La cantidad de productos"
        ],
        answer: 2,
        explanation: "MIN() devuelve el menor valor no NULL de la expresión o columna."
    },
    {
        question: "¿Qué devuelve MAX(precio)?",
        options: [
            "El precio más bajo",
            "El precio más alto",
            "El promedio",
            "La cantidad de precios"
        ],
        answer: 1,
        explanation: "MAX() devuelve el mayor valor no NULL."
    },
    {
        question: "¿Qué calcula COUNT(*)?",
        options: [
            "La suma de una columna",
            "El promedio de una columna",
            "La cantidad de filas",
            "El valor máximo"
        ],
        answer: 2,
        explanation: "COUNT(*) cuenta las filas del resultado, incluso cuando algunas columnas contienen NULL."
    },
    {
        question: "¿Para qué sirve SUM(precio)?",
        options: [
            "Para sumar los precios",
            "Para contar productos",
            "Para hallar el precio mínimo",
            "Para ordenar precios"
        ],
        answer: 0,
        explanation: "SUM() suma los valores no NULL de una columna numérica."
    },
    {
        question: "¿Para qué se utiliza GROUP BY?",
        options: [
            "Para agrupar filas según una o varias columnas",
            "Para ordenar alfabéticamente",
            "Para borrar grupos",
            "Para crear permisos"
        ],
        answer: 0,
        explanation: "GROUP BY crea grupos de filas con valores comunes para poder aplicar agregaciones a cada grupo."
    },
    {
        question: "¿Qué diferencia hay entre WHERE y HAVING?",
        options: [
            "WHERE filtra filas antes de agrupar; HAVING filtra grupos",
            "WHERE ordena y HAVING elimina tablas",
            "Son exactamente iguales",
            "HAVING solo sirve para insertar datos"
        ],
        answer: 0,
        explanation: "WHERE filtra las filas de entrada. HAVING filtra los grupos después de GROUP BY y puede usar agregaciones como COUNT()."
    },
    {
        question: "¿Qué devuelve esta consulta?",
        code: "SELECT categoria, COUNT(*)\nFROM Productos\nGROUP BY categoria;",
        options: [
            "El precio promedio de todos los productos",
            "La cantidad de productos de cada categoría",
            "Solo una categoría",
            "Todos los productos ordenados"
        ],
        answer: 1,
        explanation: "GROUP BY forma un grupo por categoría y COUNT(*) cuenta cuántas filas hay en cada grupo."
    },
    {
        question: "¿Qué categorías aparecen en esta consulta?",
        code: "SELECT categoria, COUNT(*) AS cantidad\nFROM Productos\nGROUP BY categoria\nHAVING COUNT(*) > 2;",
        options: [
            "Todas las categorías",
            "Las categorías con más de dos productos",
            "Las categorías con exactamente dos productos",
            "Las categorías sin productos"
        ],
        answer: 1,
        explanation: "HAVING COUNT(*) > 2 conserva únicamente los grupos que contienen más de dos filas."
    },
    {
        question: "¿Qué es una vista (VIEW)?",
        options: [
            "Una tabla virtual definida a partir de una consulta",
            "Una copia de seguridad obligatoria",
            "Un tipo de contraseña",
            "Un comando para ordenar"
        ],
        answer: 0,
        explanation: "Una vista guarda la definición de una consulta y permite consultarla como una tabla. Normalmente no almacena los resultados como una tabla física."
    },
    {
        question: "¿Qué hace este comando?",
        code: "CREATE VIEW ProductosPublicos AS\nSELECT nombre, precio FROM Productos;",
        options: [
            "Elimina la tabla Productos",
            "Crea una vista que expone nombre y precio",
            "Agrega dos productos",
            "Crea un usuario"
        ],
        answer: 1,
        explanation: "CREATE VIEW define una vista basada en la consulta. En este caso, muestra las columnas nombre y precio."
    },
    {
        question: "¿Para qué sirve GRANT SELECT?",
        options: [
            "Para conceder permiso de consulta",
            "Para borrar registros",
            "Para calcular promedios",
            "Para crear una subconsulta"
        ],
        answer: 0,
        explanation: "GRANT SELECT concede permiso para consultar los objetos indicados, según el sistema gestor y sus privilegios."
    },
    {
        question: "¿Qué hace este comando?",
        code: "GRANT SELECT ON ProductosPublicos TO lector;",
        options: [
            "Crea la vista ProductosPublicos",
            "Concede al rol lector permiso para consultar la vista",
            "Elimina el rol lector",
            "Modifica los precios"
        ],
        answer: 1,
        explanation: "GRANT concede el privilegio SELECT sobre ProductosPublicos al rol lector, si el SGBD admite esa sintaxis y se tienen los permisos necesarios."
    },
    {
        question: "¿Qué es un rol en una base de datos?",
        options: [
            "Un conjunto de permisos que puede asignarse a usuarios",
            "Una función matemática",
            "Una consulta anidada",
            "Una columna de texto"
        ],
        answer: 0,
        explanation: "Un rol permite agrupar permisos y asignarlos a usuarios para facilitar la administración del acceso."
    },
    {
        question: "¿Qué consulta combina agregaciones para cada categoría?",
        code: "SELECT categoria, COUNT(*), AVG(precio),\n       MIN(precio), MAX(precio)\nFROM Productos\nGROUP BY categoria;",
        options: [
            "Calcula estadísticas de productos por categoría",
            "Elimina las categorías",
            "Solo muestra el producto más caro",
            "Crea una vista automáticamente"
        ],
        answer: 0,
        explanation: "La consulta cuenta los productos y calcula el promedio, el mínimo y el máximo del precio para cada categoría."
    }
];


// ===============================
// LÓGICA DEL QUIZ
// ===============================

let currentLevel = 1;
let currentQuestion = 0;
let score = 0;
let answered = false;

function getQuestions() {
    return currentLevel === 1 ? level1 : level2;
}

function showMenu() {
    document.getElementById("levelMenu").style.display = "block";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "none";

    document.getElementById("subtitle").textContent =
        "Aprende mientras respondes";

    document.getElementById("progressBar").style.width = "0%";
}

function startLevel(level) {
    currentLevel = level;
    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("levelMenu").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    document.getElementById("subtitle").textContent =
        level === 1 ? "Nivel 1 · Fundamentos" : "Nivel 2 · SQL avanzado";

    loadQuestion();
}

function loadQuestion() {
    answered = false;

    const questions = getQuestions();
    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `Pregunta ${currentQuestion + 1} de ${questions.length}`;

    document.getElementById("question").textContent = q.question;

    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";

    // Mostrar un ejemplo SQL cuando la pregunta lo incluya.
    if (q.code) {
        const code = document.createElement("code");
        code.className = "code-example";
        code.textContent = q.code;
        optionsContainer.appendChild(code);
    }

    q.options.forEach((option, index) => {
        const button = document.createElement("button");

        button.className = "option";
        button.textContent = option;
        button.onclick = () => selectAnswer(index, button);

        optionsContainer.appendChild(button);
    });

    document.getElementById("explanation").style.display = "none";
    document.getElementById("nextButton").style.display = "none";

    document.getElementById("progressBar").style.width =
        (currentQuestion / questions.length) * 100 + "%";
}

function selectAnswer(index, button) {
    if (answered) return;

    answered = true;

    const q = getQuestions()[currentQuestion];
    const buttons = document.querySelectorAll(".option");

    buttons.forEach(b => b.disabled = true);

    if (index === q.answer) {
        button.classList.add("correct");
        score++;
    } else {
        button.classList.add("incorrect");
        buttons[q.answer].classList.add("correct");
    }

    const explanation = document.getElementById("explanation");

    explanation.replaceChildren();

    const title = document.createElement("strong");
    title.textContent = "💡 Explicación: ";
    explanation.appendChild(title);

    explanation.appendChild(document.createTextNode(q.explanation));
    explanation.style.display = "block";

    document.getElementById("nextButton").style.display = "inline-block";
}

function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < getQuestions().length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("progressBar").style.width = "100%";

    const total = getQuestions().length;
    const percentage = Math.round((score / total) * 100);

    document.getElementById("resultTitle").textContent =
        currentLevel === 1 ? "Nivel 1 · Fundamentos" : "Nivel 2 · SQL avanzado";

    document.getElementById("score").textContent =
        `${score} / ${total}`;

    let message;

    if (percentage >= 90) {
        message = "¡Excelente! Dominas muy bien estos conceptos.";
    } else if (percentage >= 70) {
        message = "¡Muy bien! Tienes una buena comprensión del tema.";
    } else if (percentage >= 50) {
        message = "Vas por buen camino. Repasa las explicaciones.";
    } else {
        message = "Sigue practicando. ¡Cada intento te ayuda a aprender!";
    }

    document.getElementById("message").textContent = message;

    const nextButton = document.getElementById("nextLevelButton");

    if (currentLevel === 1) {
        nextButton.style.display = "inline-block";
        nextButton.textContent = "Ir al nivel 2 →";
    } else {
        nextButton.style.display = "none";
    }
}

function restartLevel() {
    startLevel(currentLevel);
}

// Mostrar el menú inicial.
showMenu();

</script>
